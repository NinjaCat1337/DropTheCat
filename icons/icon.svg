<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Meow Drop app icon: a ginger cat peeking out of an orange hole. Full-bleed, no transparency;
       everything that matters sits inside the central 80% (x/y 102..922) for rounded / maskable crops. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FD1FF"/>
      <stop offset="0.55" stop-color="#93AEFC"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="sky" cx="0.28" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="468" x2="0" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC786"/>
      <stop offset="0.45" stop-color="#FF9F38"/>
      <stop offset="1" stop-color="#EE7A1E"/>
    </linearGradient>
    <linearGradient id="pit" x1="0" y1="530" x2="0" y2="798" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#220A02"/>
      <stop offset="0.6" stop-color="#4E1806"/>
      <stop offset="1" stop-color="#7A2C0C"/>
    </linearGradient>
    <radialGradient id="fur" cx="430" cy="490" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFCF91"/>
      <stop offset="0.5" stop-color="#FF9A2E"/>
      <stop offset="1" stop-color="#EA7420"/>
    </radialGradient>
    <linearGradient id="ear" x1="0" y1="350" x2="0" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3861F"/>
      <stop offset="1" stop-color="#FF9A2E"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="390" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8FB2"/>
      <stop offset="1" stop-color="#FFC4D6"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="570" x2="0" y2="684" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#24142F"/>
      <stop offset="0.55" stop-color="#36204A"/>
      <stop offset="1" stop-color="#6B4FA0"/>
    </linearGradient>
    <linearGradient id="paw" x1="0" y1="762" x2="0" y2="856" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC27F"/>
      <stop offset="1" stop-color="#FF9F3E"/>
    </linearGradient>
    <radialGradient id="shade" cx="512" cy="560" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="front">
      <rect x="0" y="664" width="1024" height="360"/>
    </clipPath>
    <clipPath id="pitClip">
      <path d="M292,530 H732 A90,90 0 0 1 822,620 V708 A90,90 0 0 1 732,798 H292 A90,90 0 0 1 202,708 V620 A90,90 0 0 1 292,530 Z"/>
    </clipPath>
    <!-- 4-point sparkle, centred on 0,0, radius 1 -->
    <path id="spark" d="M0,-1 Q0.07,-0.07 1,0 Q0.07,0.07 0,1 Q-0.07,0.07 -1,0 Q-0.07,-0.07 0,-1 Z"/>
  </defs>

  <!-- sky -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="860" cy="170" r="90" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="130" cy="880" r="120" fill="#FFFFFF" opacity="0.08"/>

  <!-- hole: soft shadow, rim, pit -->
  <rect x="150" y="500" width="724" height="392" rx="150" fill="#4A2A80" opacity="0.32" filter="url(#soft)"/>
  <path d="M290,468 H734 A150,150 0 0 1 884,618 V710 A150,150 0 0 1 734,860 H290 A150,150 0 0 1 140,710 V618 A150,150 0 0 1 290,468 Z"
        fill="url(#rim)" stroke="#A3460C" stroke-width="16"/>
  <path d="M300,490 H724 A128,128 0 0 1 852,600" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="14" stroke-linecap="round"/>
  <path d="M292,530 H732 A90,90 0 0 1 822,620 V708 A90,90 0 0 1 732,798 H292 A90,90 0 0 1 202,708 V620 A90,90 0 0 1 292,530 Z"
        fill="url(#pit)" stroke="#A3460C" stroke-width="12"/>
  <g clip-path="url(#pitClip)">
    <rect x="180" y="466" width="664" height="112" fill="#000000" opacity="0.38" filter="url(#soft)"/>
  </g>

  <!-- cat, standing in the pit -->
  <g stroke="#A3460C" stroke-width="16" stroke-linejoin="round">
    <!-- ears -->
    <path d="M326,548 Q338,450 376,372 Q388,350 408,366 Q448,400 486,458 Z" fill="url(#ear)"/>
    <path d="M698,548 Q686,450 648,372 Q636,350 616,366 Q576,400 538,458 Z" fill="url(#ear)"/>
  </g>
  <path d="M354,520 Q364,458 386,412 Q394,398 406,410 Q434,438 458,472 Z" fill="url(#inner)"/>
  <path d="M670,520 Q660,458 638,412 Q630,398 618,410 Q590,438 566,472 Z" fill="url(#inner)"/>
  <!-- head -->
  <path d="M512,440 C655,440 734,516 734,628 C734,726 655,816 512,816 C369,816 290,726 290,628 C290,516 369,440 512,440 Z"
        fill="url(#fur)" stroke="#A3460C" stroke-width="16"/>
  <!-- tabby stripes -->
  <g stroke="#D9661A" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M512,448 V498"/>
    <path d="M470,452 L476,490"/>
    <path d="M554,452 L548,490"/>
  </g>
  <!-- gloss -->
  <ellipse cx="404" cy="506" rx="52" ry="23" transform="rotate(-28 404 506)" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="352" cy="560" r="11" fill="#FFFFFF" opacity="0.5"/>
  <!-- muzzle -->
  <g fill="#FFD9A8">
    <ellipse cx="472" cy="708" rx="64" ry="48"/>
    <ellipse cx="552" cy="708" rx="64" ry="48"/>
    <ellipse cx="512" cy="740" rx="46" ry="34"/>
  </g>
  <!-- blush -->
  <ellipse cx="368" cy="702" rx="40" ry="23" fill="#FF668C" opacity="0.45"/>
  <ellipse cx="656" cy="702" rx="40" ry="23" fill="#FF668C" opacity="0.45"/>
  <!-- eyes -->
  <ellipse cx="430" cy="628" rx="45" ry="55" fill="url(#eye)"/>
  <ellipse cx="594" cy="628" rx="45" ry="55" fill="url(#eye)"/>
  <circle cx="416" cy="606" r="20" fill="#FFFFFF"/>
  <circle cx="580" cy="606" r="20" fill="#FFFFFF"/>
  <circle cx="448" cy="654" r="8" fill="#FFFFFF"/>
  <circle cx="612" cy="654" r="8" fill="#FFFFFF"/>
  <!-- nose + mouth -->
  <path d="M490,680 Q512,674 534,680 Q522,704 512,706 Q502,704 490,680 Z" fill="#FF86A6" stroke="#C24A72" stroke-width="5" stroke-linejoin="round"/>
  <path d="M512,706 V718 M474,716 Q492,742 512,720 Q532,742 550,716" fill="none" stroke="#33203F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- whiskers -->
  <g stroke="#A3460C" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M342,706 Q300,698 256,700"/>
    <path d="M344,730 Q300,734 260,746"/>
    <path d="M682,706 Q724,698 768,700"/>
    <path d="M680,730 Q724,734 764,746"/>
  </g>

  <!-- front lip of the rim, over the cat -->
  <g clip-path="url(#front)">
    <path fill-rule="evenodd" fill="url(#rim)" stroke="#A3460C" stroke-width="16"
          d="M290,468 H734 A150,150 0 0 1 884,618 V710 A150,150 0 0 1 734,860 H290 A150,150 0 0 1 140,710 V618 A150,150 0 0 1 290,468 Z
             M292,530 H732 A90,90 0 0 1 822,620 V708 A90,90 0 0 1 732,798 H292 A90,90 0 0 1 202,708 V620 A90,90 0 0 1 292,530 Z"/>
    <path d="M292,530 H732 A90,90 0 0 1 822,620 V708 A90,90 0 0 1 732,798 H292 A90,90 0 0 1 202,708 V620 A90,90 0 0 1 292,530 Z"
          fill="none" stroke="#A3460C" stroke-width="12"/>
  </g>

  <!-- paws hooked over the lip -->
  <g stroke="#A3460C" stroke-width="16">
    <ellipse cx="420" cy="806" rx="70" ry="50" fill="url(#paw)"/>
    <ellipse cx="604" cy="806" rx="70" ry="50" fill="url(#paw)"/>
  </g>
  <g stroke="#A3460C" stroke-width="8" stroke-linecap="round" opacity="0.6">
    <path d="M398,820 V846 M442,820 V846"/>
    <path d="M582,820 V846 M626,820 V846"/>
  </g>
  <ellipse cx="398" cy="788" rx="20" ry="9" fill="#FFFFFF" opacity="0.55"/>
  <ellipse cx="582" cy="788" rx="20" ry="9" fill="#FFFFFF" opacity="0.55"/>

  <!-- sparkles -->
  <g fill="#FFFFFF">
    <use href="#spark" transform="translate(200 330) scale(58)"/>
    <use href="#spark" transform="translate(826 380) scale(44)"/>
    <use href="#spark" transform="translate(752 252) scale(26)" opacity="0.85"/>
    <use href="#spark" transform="translate(290 232) scale(20)" opacity="0.8"/>
  </g>
</svg>
